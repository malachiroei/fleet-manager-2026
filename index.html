<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fleet Manager Pro</title>
    <!-- Tab + home screen icon: square dark icon so Android/iOS לא יוסיפו לוח לבן סביב -->
    <!-- v=26: מקור car.png — לוגו רכב מעודכן -->
    <link rel="shortcut icon" type="image/png" href="/og-image.png?v=26" />
    <link rel="icon" type="image/png" href="/og-image.png?v=26" />
    <link rel="apple-touch-icon" href="/og-image.png?v=26" />
    <link rel="apple-touch-icon" sizes="180x180" href="/og-image.png?v=26" />
    <link rel="manifest" href="/site.webmanifest?v=26" />
    <meta name="description" content="מערכת מקצועית לניהול צי רכבים - מעקב רכבים, נהגים, טיפולים והתראות תקינות" />
    <meta name="author" content="Fleet Manager Pro" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <meta property="og:title" content="Fleet Manager Pro | ניהול צי רכבים" />
    <meta property="og:description" content="מערכת מקצועית לניהול צי רכבים - מעקב רכבים, נהגים, טיפולים והתראות תקינות" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://fleet-manager-pro.com/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@FleetManagerPro" />
    <meta name="twitter:image" content="https://fleet-manager-pro.com/og-image.png" />

    <!-- PWA Meta — רקע כהה עקבי עם האפליקציה (ללא «מסגרת» כחולה בטעינה) -->
    <meta name="theme-color" content="#02040a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Empty-ish title so home screen shows icon only where OS allows -->
    <meta name="apple-mobile-web-app-title" content="&#x2060;" />
  </head>

  <body>
    <div id="root">
      <!-- מסך ראשון לפני React: יוסר אוטומטית כשהאפליקציה נטענת -->
      <div id="fleet-boot-splash" class="fleet-boot-splash" aria-hidden="true">
        <img
          class="fleet-boot-splash__img"
          src="/carnew.png"
          alt=""
          width="1200"
          height="800"
          decoding="async"
          fetchpriority="high"
        />
      </div>
    </div>
    <style>
      .fleet-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 0;
        min-height: 100dvh;
        min-width: 100%;
        background: linear-gradient(165deg, #0f172a 0%, #02040a 55%, #00040a 100%);
      }
      .fleet-boot-splash__img {
        display: block;
        width: 100%;
        height: 100%;
        max-height: 100dvh;
        object-fit: contain;
        object-position: center;
        padding: clamp(8px, 3vmin, 28px);
        box-sizing: border-box;
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
