# פונקציות Resend נקראות מהדפדפן. אם verify_jwt=true (ברירת מחדל בשער), מתקבל 401
# למרות Bearer תקין בחלק מהפרויקטים/גרסאות. שתי ההתראות מיושרות ל־false — כמו פריסה יציבה של מייל ק״מ.
# סיכון מוגבל: השליחה מוגבלת לכתובות מהקוד + דורשת RESEND_API_KEY בשרת.
[functions.send-mileage-notification]
verify_jwt = false

[functions.send-service-update-notification]
verify_jwt = false

[functions.send-fleet-field-update-notification]
verify_jwt = false

[functions.send-handover-notification]
